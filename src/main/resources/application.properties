# Variables de entorno: se leen del sistema o de un archivo .env en la raiz del proyecto (ver .env.example)
spring.config.import=optional:file:.env[.properties]

spring.application.name=pelisflix
spring.datasource.url = jdbc:mysql://localhost:3306/pelisflix
spring.datasource.username = ${DB_USERNAME}
spring.datasource.password = ${DB_PASSWORD}
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver
spring.jpa.database-platform = org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql = true
spring.jpa.hibernate.ddlAuto = update
spring.profiles.active=dev

# Secret Key
jwt.secret.key = ${JWT_SECRET_KEY}

# Expiration Time
jwt.expiration.time = 86400000

# Path Character images
spring.character.image = src/main/resources/images/characters/

# Path genero image
spring.genero.image = src/main/resources/images/genero/

# Path peliculas series images
spring.peliculas.series.image = src/main/resources/images/peliculasSeries/

# Configuracion para el envio de emails

## Especificamos el tamaño maximo de archivos que vamos a recibir en la aplicacion
#spring.servlet.multipart.max-file-size=10MB
#spring.servlet.multipart.max-request-size=10MB

sendgrid.api-key = ${SENDGRID_API_KEY}
sendgrid.email.from = ${SENDGRID_EMAIL_FROM}